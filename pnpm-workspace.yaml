packages:
  - "apps/hub"
  - "apps/desktop"
  - "images/*"
  - "templates/*"
allowBuilds:
  unrs-resolver: true
  esbuild: true
  koffi: true
  sharp: true
  electron: true
  electron-winstaller: false
  "@swc/core": true
  cbor-extract: false
minimumReleaseAgeExclude:
  - eve@0.91.0
  - "@agent-browser/eve@0.41.1"
  - "@agent-browser/sandbox@0.41.1"
  - "@ai-sdk/openai@4.0.107"
  - "@ai-sdk/provider-utils@5.0.73"
  - "@vercel/cli-support@65.11.0"
  - "@vercel/vc-native-darwin-arm64@65.11.0"
  - "@vercel/vc-native-darwin-x64@65.11.0"
  - "@vercel/vc-native-linux-arm64-musl@65.11.0"
  - "@vercel/vc-native-linux-arm64@65.11.0"
  - "@vercel/vc-native-linux-x64-musl@65.11.0"
  - "@vercel/vc-native-linux-x64@65.11.0"
  - "@vercel/vc-native-win32-arm64@65.11.0"
  - "@vercel/vc-native-win32-x64@65.11.0"
  - vercel@65.11.0
patchedDependencies:
  decode-named-character-reference@1.3.0: patches/decode-named-character-reference@1.3.0.patch
  streamdown@2.7.1: patches/streamdown@2.7.1.patch
packageExtensions:
  streamdown@2.7.1:
    dependencies:
      cn: "0.5.0"
